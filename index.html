<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="أكاديمية جَهير للإلقاء والخطابة | Jaheer Academy">
<title>أكاديمية جَهير</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@300;400;500;700&family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bur:#1e0205;--bur2:#100103;--ivory:#f8f2e6;--beige:#ebe0c9;--gold:#a98450;--char:#2a2422;--ink:#2b211c;--line:rgba(43,33,28,.16);
--head:'Amiri','Traditional Arabic',serif;--body:'Tajawal',system-ui,sans-serif;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html[lang=en]{--head:'Cormorant Garamond',Georgia,serif;--body:'Inter',system-ui,sans-serif}
*,*::before,*::after{box-sizing:inherit;margin:0}
html{scroll-behavior:smooth;scroll-padding-top:calc(64px + env(safe-area-inset-top,0px))}
body{background:var(--ivory);color:var(--ink);font-family:var(--body);font-size:1.05rem;line-height:1.95;overflow-x:hidden}
html[lang=en] body{font-size:1rem;line-height:1.75}
a{color:inherit}button,summary{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--bur);outline-offset:3px}
section{padding:5rem 1.4rem}.in{max-width:1120px;margin:0 auto}
.ey{font-size:.9rem;color:var(--gold);font-weight:700}
html[lang=en] .ey{letter-spacing:.14em;text-transform:uppercase;font-size:.78rem}
h2{font-family:var(--head);font-weight:700;font-size:clamp(2.1rem,6.4vw,3.2rem);line-height:1.35;color:var(--bur)}
html[lang=en] h2{font-size:clamp(2.2rem,6.4vw,3.4rem);line-height:1.15}
.rule{width:44px;height:2px;background:var(--gold);margin:.8rem 0 1.4rem}
.lead{max-width:48ch;color:rgba(43,33,28,.78)}.lead p+p{margin-top:.9rem}
.ph{border:1px dashed var(--gold);color:#7a5d2e;font-size:.85rem;display:grid;place-items:center;text-align:center;padding:.8rem;background:rgba(169,132,80,.08)}
.fd{opacity:0;transition:opacity .9s}.fd.on{opacity:1}
.btn{display:inline-block;background:var(--bur);color:var(--ivory);padding:.75rem 1.9rem;text-decoration:none;font-weight:500;border:1px solid var(--bur);transition:background .3s,color .3s}
.btn:hover{background:var(--bur2)}.btn.o{background:none;color:var(--bur)}.btn.o:hover{background:var(--bur);color:var(--ivory)}
.fit{width:100%;height:100%;object-fit:cover;display:block}
/* nav */
.nav{position:sticky;top:0;z-index:20;background:var(--bur);border-bottom:1px solid rgba(235,224,201,.2)}
.nav .btn{background:var(--ivory);color:var(--bur);border-color:var(--ivory)}.nav .btn:hover{background:var(--beige)}
.hv[hidden]{display:none}.hero.solo{grid-template-columns:1fr!important;min-height:auto!important}.solo .ht{max-width:760px!important;margin:0 auto!important;padding:4.5rem 1.4rem!important}
.nv{max-width:1180px;margin:0 auto;height:62px;padding:0 1.2rem;display:flex;align-items:center;gap:.8rem}
.brand{font-family:var(--head);font-weight:700;font-size:1.45rem;color:var(--bur);text-decoration:none;margin-inline-end:auto}
.brand img{height:38px;width:auto;display:block}
.mb,.lg{border:1px solid var(--beige);background:none;color:var(--ivory);height:38px;min-width:42px;padding:0 .8rem;font-size:.9rem;font-weight:500;transition:background .3s,color .3s}
.mb{font-size:1.2rem;padding:0}.lg:hover{background:var(--ivory);color:var(--bur)}
.nav ul{list-style:none;padding:.4rem 1.2rem 1rem;position:absolute;top:62px;inset-inline:0;background:var(--bur2);display:none}
.nav.open ul{display:block}.nav li a{display:block;padding:.65rem 0;text-decoration:none;border-bottom:1px solid rgba(235,224,201,.18);font-weight:500;color:var(--ivory)}
.nc{display:none}
@media(min-width:1020px){.mb{display:none}.nav ul{display:flex;position:static;gap:1.4rem;border:0;padding:0;background:none}.nav li a{border:0;padding:.3rem 0;font-size:.95rem;border-bottom:2px solid transparent}.nav li a:hover{color:#fff;border-color:var(--gold)}.nc{display:inline-block;padding:.45rem 1.3rem}}
/* hero */
#home{padding:0}.hero{display:grid}
.hv{position:relative;background:var(--bur);min-height:44svh;display:grid;place-items:center;overflow:hidden;order:-1}
.hv .bg{position:absolute;inset:0}.hv.has::after{content:"";position:absolute;inset:0;background:rgba(16,1,3,.5)}
#logo{position:relative;z-index:1;width:min(320px,68%)}#logo img{width:100%;display:block}
.hn{position:absolute;bottom:.8rem;inset-inline:1rem;text-align:center;font-size:.78rem;color:rgba(235,224,201,.75);z-index:1}
.ht{padding:3rem 1.4rem 3.5rem;max-width:640px;margin:0 auto;width:100%}
.ht h1{font-family:var(--head);font-weight:700;font-size:clamp(3rem,11vw,5rem);line-height:1.15;color:var(--bur);margin:.3rem 0 .1rem}
.ht .tg{font-family:var(--head);font-size:1.5rem;color:var(--char);font-weight:700}
.ht .it{margin:1.2rem 0;color:rgba(43,33,28,.78)}
.sgn{border-inline-start:3px solid var(--gold);padding:.2rem 1.1rem;margin:1.6rem 0 1.8rem;font-family:'Amiri',serif;font-size:clamp(1.2rem,4.4vw,1.5rem);line-height:2.1;color:var(--bur);direction:rtl;text-align:right}
html[lang=en] .sgn{border-inline-start:0;border-inline-end:3px solid var(--gold)}
.sgn p+p{margin-top:.5rem}
.cta{display:flex;gap:.8rem;flex-wrap:wrap}
@media(min-width:900px){.hero{grid-template-columns:1.05fr 1fr;min-height:calc(100svh - 62px)}.hv{order:0;min-height:auto}.ht{padding:4rem 2rem 4rem 3rem;padding-inline:2rem 3rem;margin:0;margin-inline-end:auto;max-width:none;align-self:center}}
/* stats */
.stats{background:var(--bur);color:var(--ivory);padding:2.2rem 1.4rem}
.sr{max-width:1120px;margin:0 auto;display:grid;grid-template-columns:repeat(2,1fr);gap:1.8rem 1rem;text-align:center}@media(min-width:760px){.sr{grid-template-columns:repeat(4,1fr)}}
.sr b{display:block;font-family:var(--head);font-size:clamp(1.7rem,6vw,2.8rem);font-weight:700;line-height:1.3}.sr b{font-variant-numeric:lining-nums;direction:ltr}.sr span{display:block;font-weight:600;font-size:1rem}.sr small{display:block;font-size:.78rem;opacity:.75;line-height:1.5;margin-top:.15rem}
/* about */
#about{background:var(--beige)}
.ag{display:grid;gap:2.5rem}.ag .pic{aspect-ratio:4/3;overflow:hidden}.ag .pic .ph{height:100%}
.ab{display:grid;gap:1.6rem;margin-top:1.8rem}.ab div{border-top:2px solid var(--bur);padding-top:.8rem}
.ab h3{font-family:var(--head);font-size:1.5rem;color:var(--bur)}.ab p{color:rgba(43,33,28,.75);font-size:.96rem;line-height:1.8}
@media(min-width:900px){.ag{grid-template-columns:1fr 1.1fr;gap:4rem;align-items:center}.ab{grid-template-columns:1fr 1fr}}
/* journey */
.jn{display:grid;gap:3rem;margin-top:3.5rem;position:relative}
.jn::before{content:"";position:absolute;top:8px;bottom:8px;inset-inline-start:17px;width:2px;background:var(--gold);opacity:.5}
.cs{position:relative;padding-inline-start:3.6rem}
.nd{position:absolute;inset-inline-start:0;top:0;width:36px;height:36px;border-radius:50%;background:var(--ac);color:var(--ivory);display:grid;place-items:center;font-family:var(--head);font-weight:700;font-size:1.1rem;box-shadow:0 0 0 5px var(--ivory)}
.cs .im{aspect-ratio:4/3;overflow:hidden;margin-bottom:1rem}.cs .im .ph{height:100%}
.cs .st{font-size:.8rem;color:var(--ac);font-weight:700;display:block}
.cs h3{font-family:var(--head);font-size:clamp(1.6rem,5.4vw,2rem);line-height:1.3;color:var(--ac)}
.cs .oa{font-family:'Amiri',serif;font-size:1.05rem;color:var(--char);direction:rtl;display:block}
.cs p{color:rgba(43,33,28,.75);font-size:.96rem;line-height:1.8}
details{margin-top:.8rem;border-top:1px solid var(--line);padding-top:.5rem}summary{color:var(--ac);font-weight:500}
@media(min-width:960px){.jn{grid-template-columns:repeat(4,1fr);gap:1.6rem}.jn::before{top:17px;bottom:auto;inset-inline:0;width:auto;height:2px}.cs{padding:3.4rem 0 0}}
/* marathon */
#marathon{background:var(--bur);color:var(--ivory)}
#marathon h2{color:var(--ivory)}#marathon .lead{color:rgba(248,242,230,.86)}
#marathon .ph{color:var(--beige);border-color:rgba(235,224,201,.5);background:rgba(248,242,230,.06)}
.sb{font-family:var(--head);font-size:1.7rem;margin:3.5rem 0 1.2rem;color:var(--beige)}
.pg{display:grid;grid-template-columns:repeat(2,1fr);gap:1.4rem .9rem}
.pc{border:1px solid rgba(235,224,201,.35);padding:1.3rem .8rem;text-align:center;display:grid;gap:.2rem;align-content:start}.pc .no{font-family:var(--head);color:var(--gold);font-size:1.2rem;line-height:1}
.pc h4{font-family:var(--head);font-size:1.3rem;font-weight:700;margin-top:.6rem;line-height:1.4}
.pc p{font-size:.88rem;line-height:1.7;color:rgba(248,242,230,.8)}
@media(min-width:700px){.pg{grid-template-columns:repeat(3,1fr);gap:2rem 1.4rem}}@media(min-width:1000px){.pg{grid-template-columns:repeat(5,1fr)}}
.mg{display:grid;grid-template-columns:repeat(2,1fr);gap:.7rem}.mg>*{aspect-ratio:1;overflow:hidden}.mg>*:first-child{grid-column:span 2;aspect-ratio:16/9}
@media(min-width:800px){.mg{grid-template-columns:repeat(4,1fr)}}
.ev{display:grid;gap:1rem}.ev .big{aspect-ratio:16/9;overflow:hidden}.ev .big .ph{height:100%}.ev .ds{display:grid;gap:.7rem;align-content:start}.ev .ds .ph{justify-items:start;text-align:start;padding:1rem 1.2rem}
@media(min-width:800px){.ev{grid-template-columns:1.3fr 1fr;gap:2.5rem}}
/* community */
.ac{display:grid;gap:1rem;margin-top:2.5rem}.ac article{background:var(--beige);padding:1.5rem;border-top:2px solid var(--gold)}
.ac small{color:var(--bur);font-weight:700}.ac h3{font-family:var(--head);font-size:1.4rem;line-height:1.4;margin:.2rem 0}.ac p{font-size:.95rem;color:rgba(43,33,28,.72);line-height:1.8}
@media(min-width:700px){.ac{grid-template-columns:repeat(3,1fr)}}
.pr{margin-top:3rem}.pr h3{font-family:var(--head);font-size:1.5rem;color:var(--bur);margin-bottom:1rem}
.pl{display:grid;grid-template-columns:repeat(3,1fr);gap:.7rem}.pl>*{height:70px;display:grid;place-items:center;background:var(--beige)}.pl img{max-width:70%;max-height:70%;object-fit:contain;filter:grayscale(1)}
@media(min-width:800px){.pl{grid-template-columns:repeat(6,1fr)}}
/* gallery */
#gallery{background:var(--beige)}
.gg{display:grid;grid-template-columns:repeat(2,1fr);gap:.7rem;margin-top:2.5rem}
.gi{margin:0;overflow:hidden;aspect-ratio:1}.gi:nth-child(1),.gi:nth-child(5){grid-column:span 2;aspect-ratio:16/9}
.gi .ph,.gi img,.gi video{width:100%;height:100%;object-fit:cover;display:grid;transition:transform .8s}.gi:hover img,.gi:hover video{transform:scale(1.04)}
@media(min-width:800px){.gg{grid-template-columns:repeat(4,1fr);gap:1rem}.gi:nth-child(1){grid-column:span 2;grid-row:span 2;aspect-ratio:auto}.gi:nth-child(5){grid-column:span 2;aspect-ratio:2/1}}
.cb{background:var(--ivory);text-align:center;border-top:1px solid var(--line)}.cb .lead{margin:0 auto 1.6rem}.cb .rule{margin-inline:auto}
/* footer */
footer{background:var(--char);color:var(--beige);padding:4rem 1.4rem calc(2rem + env(safe-area-inset-bottom,0px))}
.fg{max-width:1120px;margin:0 auto;display:grid;gap:2.2rem}
footer #logo2{width:min(200px,56vw)}footer #logo2 img{width:100%;display:block}
footer h4{font-family:var(--head);font-size:1.3rem;color:var(--ivory);margin-bottom:.5rem}
footer ul{list-style:none;padding:0}footer li a{text-decoration:none;opacity:.85}footer li a:hover{opacity:1;text-decoration:underline}
footer .sgn{color:var(--beige);font-size:1.1rem;margin:1.2rem 0 0}
footer .ph{color:var(--beige);border-color:rgba(235,224,201,.4);background:none;margin-bottom:.5rem;padding:.4rem 1rem;justify-items:start}
.cp{max-width:1120px;margin:2.5rem auto 0;padding-top:1.2rem;border-top:1px solid rgba(235,224,201,.2);font-size:.8rem;opacity:.65}
@media(min-width:860px){.fg{grid-template-columns:1.6fr 1fr 1.2fr 1fr}}
.sgn{container-type:inline-size}
.sgn .bt{display:grid;grid-template-columns:1fr;text-align:center;font-size:clamp(1rem,5.6cqi,1.35rem);line-height:2.1;white-space:nowrap}
.sgn .bt+.bt{margin-top:.8rem;padding-top:.8rem;border-top:1px solid rgba(169,132,80,.35)}
@container (min-width:500px){.sgn .bt{grid-template-columns:1fr 1fr;gap:0 1.2rem;text-align:start;font-size:clamp(1rem,3.3cqi,1.2rem)}.sgn .bt span:last-child{text-align:end}}
.cb{padding:3rem 1.4rem}footer .btn{background:var(--ivory);color:var(--bur);border-color:var(--ivory)}footer .btn:hover{background:var(--beige)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}html{scroll-behavior:auto}}
</style>
</head>
<body>
<nav class="nav" id="nav"><div class="nv"><a class="brand" href="#home" id="brand"></a><ul id="nl"></ul><a class="btn nc" href="#marathon" id="nc"></a><button class="lg" id="lg"></button><button class="mb" id="mb" aria-expanded="false">☰</button></div></nav>

<header id="home"><div class="hero">
  <div class="ht">
    <span class="ey" id="eh"></span>
    <h1 id="h1"></h1><p class="tg" id="tg"></p>
    <div class="sgn" id="sg1" lang="ar"></div>
    <div class="cta"><a class="btn" href="#colors" id="b1"></a><a class="btn o" href="#marathon" id="b2"></a></div>
  </div>
  <div class="hv" id="hv" hidden></div>
</div></header>
<div class="stats"><div class="sr" id="sr"></div></div>

<section id="about"><div class="in fd"><div class="ag">
  <div><span class="ey" id="ea"></span><h2 id="ha"></h2><div class="rule"></div><div class="lead" id="al"></div><div class="ab" id="ab"></div></div>
  <div class="pic" id="ap"></div>
</div></div></section>

<section id="colors"><div class="in">
  <div class="fd"><span class="ey" id="ec"></span><h2 id="hc"></h2><div class="rule"></div><p class="lead" id="cl"></p></div>
  <div class="jn fd" id="jn"></div>
</div></section>

<section id="marathon"><div class="in fd">
  <span class="ey" id="em" style="color:var(--beige)"></span><h2 id="hm"></h2><div class="rule"></div><p class="lead" id="mi"></p>
  <h3 class="sb" id="s1"></h3><div class="pg" id="pg"></div>
</div></section>

<section class="cb"><div class="in fd"><a class="btn" href="#contact" id="b3"></a></div></section>

<footer id="contact"><div class="fg">
  <div><div id="logo2"></div><div class="sgn" id="sg2" lang="ar"></div></div>
  <div><h4 id="f1"></h4><ul id="fl"></ul></div>
  <div><h4 id="f2"></h4><div id="ci"></div></div>
  <div><h4 id="f3"></h4><ul id="so"></ul></div>
</div><p class="cp" id="cp"></p></footer>
