<h1>ملاحظاتي</h1>
<p class="sub">ملاحظات لجنة التحكيم على أدائك.</p>
<form id="login" novalidate>
<label>البريد الإلكتروني<input name="email" type="email" required maxlength="254" autocomplete="email" dir="ltr"></label>
<label>كلمة المرور<input name="password" type="password" required maxlength="72" autocomplete="current-password"></label>
<button class="btn" type="submit">دخول</button></form>
<section id="panel" hidden><div id="list"></div><p class="alt"><button class="btn o" id="out" type="button">تسجيل الخروج</button></p></section>
<p id="msg" class="msg" role="status" hidden></p>
</main>
